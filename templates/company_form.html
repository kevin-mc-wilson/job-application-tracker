{% extends "base.html" %}

{% block title %}{{ 'Edit' if editing else 'Add' }} Company - Job Tracker{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="mb-0">{{ 'Edit' if editing else 'Add' }} Company</h1>
</div>

<div class="card stat-card" style="max-width: 40rem;">
    <div class="card-body">
        <form method="post">
            <div class="mb-3">
                <label for="company_name" class="form-label">Company name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="company_name" name="company_name"
                       maxlength="100" required value="{{ company.company_name or '' }}">
            </div>
            <div class="mb-3">
                <label for="industry" class="form-label">Industry</label>
                <input type="text" class="form-control" id="industry" name="industry"
                       maxlength="50" value="{{ company.industry or '' }}">
            </div>
            <div class="mb-3">
                <label for="website" class="form-label">Website</label>
                <input type="url" class="form-control" id="website" name="website"
                       maxlength="200" placeholder="https://example.com" value="{{ company.website or '' }}">
            </div>
            <div class="row">
                <div class="col-md-8 mb-3">
                    <label for="city" class="form-label">City</label>
                    <input type="text" class="form-control" id="city" name="city"
                           maxlength="50" value="{{ company.city or '' }}">
                </div>
                <div class="col-md-4 mb-3">
                    <label for="state" class="form-label">State</label>
                    <input type="text" class="form-control" id="state" name="state"
                           maxlength="50" value="{{ company.state or '' }}">
                </div>
            </div>
            <div class="mb-3">
                <label for="notes" class="form-label">Notes</label>
                <textarea class="form-control" id="notes" name="notes" rows="3">{{ company.notes or '' }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">{{ 'Save Changes' if editing else 'Add Company' }}</button>
            <a href="{{ url_for('companies') }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
